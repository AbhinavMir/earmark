<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earmark — a native Mac app for Audible</title>
<meta name="description" content="A native macOS app for your Audible library.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<meta property="og:title" content="Earmark">
<meta property="og:description" content="A native macOS app for your Audible library.">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0b0b0c;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #0f9e97;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c;
      --fg: #f5f5f6;
      --muted: #9ca3af;
      --line: #26262a;
      --accent: #29D0C7;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  main { max-width: 460px; }

  .mark {
    font-size: 64px;
    line-height: 1;
    display: block;
    margin: 0 auto 24px;
  }

  h1 {
    font-size: 40px;
    line-height: 1.1;
    letter-spacing: -0.025em;
    font-weight: 600;
    margin: 0 0 12px;
  }

  p.lede {
    font-size: 18px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 32px;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  a.btn {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    transition: opacity .15s ease, background-color .15s ease;
  }
  a.primary { background: var(--fg); color: var(--bg); }
  a.primary:hover { opacity: .85; }
  a.secondary { border-color: var(--line); color: var(--fg); }
  a.secondary:hover { background: var(--line); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  p.meta {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  p.meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  a.quiet { color: var(--muted); }
</style>
</head>
<body>
<main>
  <span class="mark" role="img" aria-label="Earmark">📖</span>
  <h1>Earmark</h1>
  <p class="lede">A native Mac app for your Audible library.</p>

  <div class="actions">
    <a class="btn primary" href="https://github.com/AbhinavMir/earmark/releases/latest/download/Earmark-1.0.3.dmg">Download for Mac</a>
    <a class="btn secondary" href="https://github.com/AbhinavMir/earmark">Source</a>
  </div>

  <p class="meta">
    macOS 14+ · requires <code>brew install ffmpeg</code><br>
    <a class="quiet" href="https://github.com/AbhinavMir/audible-kit">AudibleKit</a> · not affiliated with Audible
  </p>
</main>
</body>
</html>
