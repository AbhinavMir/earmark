<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earmarky — a native Mac app for Audible</title>
<meta name="description" content="A native macOS app for your Audible library.">
<link rel="icon" href="favicon.png">
<meta property="og:title" content="Earmarky">
<meta property="og:description" content="A native macOS app for your Audible library.">
<meta property="og:image" content="https://earmarky.com/hero.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0b0b0c;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #0a6f6a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c;
      --fg: #f5f5f6;
      --muted: #9ca3af;
      --line: #26262a;
      --accent: #4fd8cf;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 72px 24px 96px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  main { max-width: 460px; margin: 0 auto; }

  .hero {
    /* Its own block, below the text rather than inside it: a picture this
       wide cannot live in a column meant for a sentence. */
    margin: 56px auto 0;
    width: min(1180px, calc(100vw - 48px));
  }
  .hero img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, .10),
      0 30px 70px -18px rgba(3, 36, 36, .40);
  }
  @media (prefers-color-scheme: dark) {
    .hero img {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .07),
        0 30px 70px -18px rgba(0, 0, 0, .75);
    }
  }

  .shots {
    max-width: 1100px;
    margin: 76px auto 0;
    display: grid;
    gap: 64px;
  }

  figure { margin: 0; text-align: center; }

  figure img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    /* Two shadows: a close one for the edge, a wide soft one for the lift. */
    box-shadow:
      0 1px 2px rgba(0, 0, 0, .10),
      0 24px 60px -12px rgba(3, 36, 36, .34);
  }
  @media (prefers-color-scheme: dark) {
    figure img {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .07),
        0 24px 60px -12px rgba(0, 0, 0, .7);
    }
  }

  figcaption {
    margin-top: 18px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
  }
  figcaption strong { color: var(--fg); font-weight: 600; }

  .mark {
    display: block;
    width: 116px;
    height: 116px;
    margin: 0 auto 26px;
    border-radius: 26px;
    /* The artwork is dark, so it needs an edge of its own against the page. */
    box-shadow: 0 1px 3px rgba(0, 0, 0, .18), 0 10px 28px rgba(3, 36, 36, .22);
  }

  h1 {
    font-size: 40px;
    line-height: 1.1;
    letter-spacing: -0.025em;
    font-weight: 600;
    margin: 0 0 12px;
  }

  p.lede {
    font-size: 18px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 32px;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  a.btn {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    transition: opacity .15s ease, background-color .15s ease;
  }
  a.primary { background: var(--fg); color: var(--bg); }
  a.primary:hover { opacity: .85; }
  a.secondary { border-color: var(--line); color: var(--fg); }
  a.secondary:hover { background: var(--line); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  p.meta {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  p.meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  a.quiet { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="mark" src="earmark-512.png" alt="Earmarky" width="116" height="116">
  <h1>Earmarky</h1>
  <p class="lede">A native Mac app for your Audible library.</p>

  <div class="actions">
    <a class="btn primary" href="https://github.com/AbhinavMir/earmark/releases/latest/download/Earmarky-1.0.0.dmg">Download for Mac</a>
    <a class="btn secondary" href="https://github.com/AbhinavMir/earmark">Source</a>
  </div>

  <p class="meta">
    macOS 14+ · requires <code>brew install ffmpeg</code><br>
    <a class="quiet" href="https://github.com/AbhinavMir/audible-kit">AudibleKit</a> · not affiliated with Audible
  </p>
</main>

<figure class="hero">
  <img src="hero.png"
       alt="Earmarky showing a library of audiobooks with the sound controls open"
       width="2200" loading="eager">
</figure>

</body>
</html>
