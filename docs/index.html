<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earmarky — a native Mac app for Audible</title>
<meta name="description" content="A native macOS app for your Audible library.">
<link rel="icon" href="favicon.png">
<meta property="og:title" content="Earmarky">
<meta property="og:description" content="A native macOS app for your Audible library.">
<meta property="og:image" content="https://earmarky.com/hero.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0b0b0c;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #0a6f6a;
  }
  /* One page, in one set of colours. The picture of the application has no
     ground of its own, so a dark page would show through it. */
  html { color-scheme: light; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 96px 40px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    /* Two columns: the words on the left, the application on the right. */
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
    gap: 72px;
    align-items: center;
  }

  main { max-width: 400px; }

  .hero { margin: 0; }
  .hero img {
    width: 100%;
    height: auto;
    display: block;
    /* The picture has transparent corners, so the shadow follows its shape
       rather than a box drawn around it. */
    filter:
      drop-shadow(0 1px 2px rgba(0, 0, 0, .12))
      drop-shadow(0 24px 48px rgba(15, 40, 40, .22));
  }

  .mark {
    display: block;
    width: 96px;
    height: 96px;
    margin: 0 0 26px;
    border-radius: 22px;
    /* The artwork is dark, so it needs an edge of its own against the page. */
    box-shadow: 0 1px 3px rgba(0, 0, 0, .16), 0 10px 26px rgba(15, 40, 40, .18);
  }

  h1 {
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 600;
    margin: 0 0 14px;
  }

  p.lede {
    font-size: 18px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 32px;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  a.btn {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    transition: opacity .15s ease, background-color .15s ease;
  }
  a.primary { background: var(--fg); color: var(--bg); }
  a.primary:hover { opacity: .85; }
  a.secondary { border-color: var(--line); color: var(--fg); }
  a.secondary:hover { background: var(--line); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  p.meta {
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0;
  }
  p.meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  a.quiet { color: var(--muted); }

  /* A narrow window has no room for two columns, so the picture goes below. */
  @media (max-width: 900px) {
    body { padding: 64px 24px 80px; }
    .page { grid-template-columns: 1fr; gap: 56px; }
    main { max-width: 520px; }
    h1 { font-size: 38px; }
  }
</style>
</head>
<body>
<div class="page">
  <main>
    <img class="mark" src="earmark-512.png" alt="Earmarky" width="96" height="96">
    <h1>Earmarky</h1>
    <p class="lede">A native Mac app for your Audible library.</p>

    <div class="actions">
      <a class="btn primary" href="https://github.com/AbhinavMir/earmark/releases/latest/download/Earmarky-1.0.0.dmg">Download for Mac</a>
      <a class="btn secondary" href="https://github.com/AbhinavMir/earmark">Source</a>
    </div>

    <p class="meta">
      macOS 14+ · requires <code>brew install ffmpeg</code><br>
      <a class="quiet" href="https://github.com/AbhinavMir/audible-kit">AudibleKit</a> · not affiliated with Audible
    </p>
  </main>

  <figure class="hero">
    <img src="hero.png"
         alt="Earmarky showing a library of audiobooks with the sound controls open"
         width="2200" loading="eager">
  </figure>
</div>
</body>
</html>
